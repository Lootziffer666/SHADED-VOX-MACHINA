  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full text-on-surface select-none">

<div class="relative z-10 flex items-center justify-between w-full">
<!-- Engine Calib Status -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full" style="background: rgba(15, 27, 26, 0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.35); backdrop-filter: blur(12px);">
<span class="inline-block w-2 h-2 rounded-full animate-ping" style="background-color: #2ecc71;"></span>
<span class="font-label-hud text-label-sm uppercase tracking-wider text-surface-container-highest">LiDAR ACTIVE</span>
</div>
<!-- Environment Mode Tactile Pill -->
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-surface-container-highest cursor-pointer active:scale-95 transition-transform" id="themeToggle" style="background: rgba(22, 38, 35, 0.9); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 3px 8px rgba(0,0,0,0.4); backdrop-filter: blur(12px);" type="button">
<span class="material-symbols-outlined text-base" style="color: #fd9754;">sensors</span>
<span class="font-label-hud text-label-sm uppercase tracking-widest text-surface-bright">AUTO 6DoF</span>
</button>
</div>
<!-- Center Hero Section: Isometric Animated Voxel Mark & Title -->
<div class="relative z-10 flex flex-col items-center justify-center my-auto py-4">
<!-- Interactive Isometric 3D Voxel Sculpture (Pure SVG Geometry with Extruded Facets) -->
<div class="relative w-48 h-48 flex items-center justify-center cursor-pointer group" id="voxelCubeAnchor">
<svg class="w-40 h-40 filter drop-shadow-2xl transition-transform duration-500 transform group-hover:scale-105" fill="none" viewbox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
<!-- Ambient Base Shadow -->
<ellipse cx="80" cy="138" fill="#050a09" opacity="0.6" rx="46" ry="14"></ellipse>
<!-- Lower Jade/Emerald Voxel Base (Center-Bottom) -->
<g transform="translate(0, 16)">
<!-- Top Face -->
<polygon fill="#249c81" opacity="0.95" points="80,72 108,56 80,40 52,56"></polygon>
<!-- Left Face -->
<polygon fill="#146351" points="52,56 80,72 80,102 52,86"></polygon>
<!-- Right Face -->
<polygon fill="#1b7762" points="80,72 108,56 108,86 80,102"></polygon>
</g>
<!-- Middle Layer Left: Emerald Voxel -->
<g transform="translate(-26, -4)">
<!-- Top Face -->
<polygon fill="#2ecc71" opacity="0.9" points="80,56 106,41 80,26 54,41"></polygon>
<!-- Left Face -->
<polygon fill="#1b8547" points="54,41 80,56 80,82 54,67"></polygon>
<!-- Right Face -->
<polygon fill="#24a85b" points="80,56 106,41 106,67 80,82"></polygon>
</g>
<!-- Middle Layer Right: Warm Amber Voxel (Sensory Accent) -->
<g transform="translate(26, -4)">
<!-- Top Face -->
<polygon fill="#f5aa38" points="80,56 106,41 80,26 54,41"></polygon>
<!-- Left Face -->
<polygon fill="#b86f14" points="54,41 80,56 80,82 54,67"></polygon>
<!-- Right Face -->
<polygon fill="#d9871e" points="80,56 106,41 106,67 80,82"></polygon>
</g>
<!-- Crown Voxel: Mint Floating Peak with Neon Pulse -->
<g class="transition-transform duration-700" transform="translate(0, -22)">
<!-- Top Face -->
<polygon fill="#98f4d7" points="80,44 104,30 80,16 56,30"></polygon>
<!-- Left Face -->
<polygon fill="#36b894" points="56,30 80,44 80,68 56,54"></polygon>
<!-- Right Face -->
<polygon fill="#5eceab" points="80,44 104,30 104,54 80,68"></polygon>
<!-- Top Edge Glint Highlight -->
<line opacity="0.8" stroke="#ffffff" stroke-linecap="round" stroke-width="1.2" x1="80" x2="104" y1="16" y2="30"></line>
<line opacity="0.8" stroke="#ffffff" stroke-linecap="round" stroke-width="1.2" x1="80" x2="56" y1="16" y2="30"></line>
</g>
<!-- Floating Orbiting Micro-Voxels -->
<rect fill="#2ecc71" height="6" opacity="0.75" transform="rotate(45 33 41)" width="6" x="30" y="38"></rect>
<rect fill="#fd9754" height="7" opacity="0.85" transform="rotate(45 127 55)" width="7" x="124" y="52"></rect>
<rect fill="#7cd7bc" height="5" opacity="0.6" transform="rotate(45 118 106)" width="5" x="116" y="104"></rect>
</svg>
<!-- Specular Ring Indicator around Logo -->
<div class="absolute inset-2 pointer-events-none rounded-full" style="border: 1px dashed rgba(124, 215, 188, 0.22);"></div>
</div>
<!-- App Title & Identity -->
<div class="text-center mt-3 flex flex-col items-center">
<div class="flex items-center gap-1.5">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile font-bold tracking-tight text-surface-bright" style="text-shadow: 0 2px 14px rgba(0,0,0,0.6);">
            VoxelScan<span style="color: #2ecc71;">.AR</span>
</h1>
</div>
<p class="font-body-sm text-body-sm text-outline-variant mt-1 tracking-wide font-medium">
          Real-Time TSDF &amp; Volumetric Mesh Engine
        </p>
</div>
<!-- Interactive Micro-Status Badge -->
<div class="mt-6 flex items-center gap-2.5 px-4 py-1.5 rounded-full" style="background: rgba(17, 30, 28, 0.88); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 14px rgba(0,0,0,0.35);">
<span class="material-symbols-outlined text-sm" style="color: #2ecc71;">view_in_ar</span>
<span class="font-label-numeric text-label-numeric text-surface-container-high tracking-tight" id="pipelineStepText">
          Lade TSDF Octree...
        </span>
<span class="w-1.5 h-1.5 rounded-full" style="background-color: #fd9754;"></span>
</div>
</div>
<!-- Bottom Section: Loading Gauge, Telemetry, and Tactile Trigger -->
<div class="relative z-10 w-full flex flex-col items-center gap-4 max-w-sm mx-auto">
<!-- Progress Bar Vessel with Tactile Sunken Groove -->
<div class="w-full flex flex-col gap-2">
<div class="flex justify-between items-baseline px-1">
<span class="font-label-hud text-label-sm text-outline-variant uppercase tracking-wider">Spatial Buffer</span>
<span class="font-label-numeric text-label-numeric text-inverse-primary font-bold" id="percentageIndicator">78%</span>
</div>
<div class="w-full h-2 rounded-full overflow-hidden p-0.5" style="background: #091110; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);">
<div class="h-full rounded-full transition-all duration-300 ease-out" id="loadingFillBar" style="width: 78%; background: linear-gradient(90deg, #1d836c 0%, #2ecc71 70%, #fd9754 100%); box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);"></div>
</div>
</div>
<!-- Tactile Shutter / Start Anchor Button -->
<button class="w-full py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 text-on-primary font-headline-sm text-headline-sm font-semibold tracking-wide cursor-pointer transition-all duration-150 active:translate-y-0.5" id="startScanAction" style="background: linear-gradient(180deg, #24997e 0%, #156d58 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.35), 0 4px 0 #0d4638, 0 10px 20px rgba(0,0,0,0.45);" type="button">
<span class="material-symbols-outlined text-xl">play_arrow</span>
<span>Tippen zum Starten</span>
</button>
<!-- System Diagnostic Telemetry Chips -->
<div class="flex flex-wrap items-center justify-center gap-2 pt-1">
<div class="px-2.5 py-1 rounded-md" style="background: rgba(14, 25, 24, 0.75); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);">
<span class="font-label-hud text-label-sm text-outline-variant">v1.4.2-b204</span>
</div>
<span class="text-outline text-xs">•</span>
<div class="px-2.5 py-1 rounded-md" style="background: rgba(14, 25, 24, 0.75); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);">
<span class="font-label-hud text-label-sm text-outline-variant">Android 6DoF Engine</span>
</div>
<span class="text-outline text-xs">•</span>
<div class="px-2.5 py-1 rounded-md" style="background: rgba(14, 25, 24, 0.75); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);">
<span class="font-label-hud text-label-sm text-outline-variant">VoxelWorld Core</span>
</div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    let progress = 78;
    const fillBar = document.getElementById('loadingFillBar');
    const percentEl = document.getElementById('percentageIndicator');
    const stepText = document.getElementById('pipelineStepText');
    const startBtn = document.getElementById('startScanAction');
    const cube = document.getElementById('voxelCubeAnchor');

    const steps = [
      { at: 82, text: 'Initialisiere ARCore 6DoF...' },
      { at: 93, text: 'Synchronisiere Voxel-Raster...' },
      { at: 100, text: 'Bereit für 3D-Scan' }
    ];

    const timer = setInterval(() => {
      if (progress < 100) {
        progress += 1;
        if (fillBar) fillBar.style.width = progress + '%';
        if (percentEl) percentEl.textContent = progress + '%';

        for (let s of steps) {
          if (progress >= s.at) {
            stepText.textContent = s.text;
          }
        }
      } else {
        clearInterval(timer);
        if (startBtn) {
          startBtn.style.background = 'linear-gradient(180deg, #2ecc71 0%, #1e8f52 100%)';
          startBtn.style.boxShadow = 'inset 0 1.5px 0 rgba(255,255,255,0.45), 0 4px 0 #135e36, 0 12px 24px rgba(46, 204, 113, 0.35)';
        }
      }
    }, 110);

    if (cube) {
      cube.addEventListener('pointerdown', () => {
        cube.style.transform = 'scale(0.94) rotate(4deg)';
      });
      cube.addEventListener('pointerup', () => {
        cube.style.transform = 'scale(1) rotate(0deg)';
      });
      cube.addEventListener('pointerleave', () => {
        cube.style.transform = 'scale(1) rotate(0deg)';
      });
    }

    if (startBtn) {
      startBtn.addEventListener('click', () => {
        startBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">sync</span><span>Lade Viewport...</span>';
      });
    }
  })();
</script></main></body></html>
